# Reusable test workflow: lint, format, docs, and cross-platform tests.
#
# Called by:
#   - ci.yml        (PR checks and manual dispatch)
#   - benchmark.yml (PR regression checks, and the tag gate in release-prepare.yml)
#   - baseline.yml  (baseline saves)
#
# Runs through `workflow_call` only.

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint, Format & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: lint

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Shellcheck release scripts
        run: shellcheck scripts/ci/*.sh

  test:
    needs: lint
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: test

      - name: Run tests
        run: cargo test --workspace
