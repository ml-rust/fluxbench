[workspace]
resolver = "2"
members = [
    "fluxbench",
    "fluxbench-cli",
    "fluxbench-core",
    "fluxbench-ipc",
    "fluxbench-logic",
    "fluxbench-macros",
    "fluxbench-report",
    "fluxbench-stats",
    "examples",
]

[workspace.package]
authors = ["Farhan Syah"]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/fluxbench"
keywords = ["benchmark", "performance", "profiling", "criterion", "statistics"]
categories = ["development-tools::profiling", "development-tools::testing"]
readme = "README.md"

[workspace.dependencies]
# Workspace crates
fluxbench = { path = "fluxbench", version = "0.2.0" }
fluxbench-cli = { path = "fluxbench-cli", version = "0.2.0" }
# No default features: only the facade's `async` feature pulls in tokio.
fluxbench-core = { path = "fluxbench-core", version = "0.2.0", default-features = false }
fluxbench-ipc = { path = "fluxbench-ipc", version = "0.2.0" }
fluxbench-logic = { path = "fluxbench-logic", version = "0.2.0" }
fluxbench-macros = { path = "fluxbench-macros", version = "0.2.0" }
fluxbench-report = { path = "fluxbench-report", version = "0.2.0" }
fluxbench-stats = { path = "fluxbench-stats", version = "0.2.0" }

# Serialization (rkyv IPC)
rkyv = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime, behind the `async` feature of fluxbench-core and fluxbench.
# Members add `rt-multi-thread`, `time`, `net`, `io-util`, or `fs` where they use them.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

# Parallelism
rayon = "1.10"

# Random number generation (for bootstrap)
rand = "0.10"

# Expression evaluation
evalexpr = "13"

# Progress reporting
indicatif = "0.18"

# Proc-macro utilities
syn = { version = "3", features = ["full", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"

# Discovery
inventory = "0.3"

# Hashing
rustc-hash = "2"

# Time utilities
# Only `Utc::now()` is used. Skipping the default `clock` feature avoids
# iana-time-zone (and its `cc` build dependency) in downstream lockfiles.
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "now"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex for variable extraction
regex = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
