[package]
name = "fluxbench-examples"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
fluxbench.workspace = true
rand.workspace = true
regex = "1"

[[example]]
name = "feature_iteration"

[[example]]
name = "feature_throughput"

[[example]]
name = "feature_async"

[[example]]
name = "feature_params"

[[example]]
name = "feature_verify"

[[example]]
name = "feature_compare"

[[example]]
name = "feature_allocations"

[[example]]
name = "feature_panic"

[[example]]
name = "library_bench"

[[example]]
name = "ci_regression"

[[example]]
name = "test_isolation"

[[example]]
name = "test_baseline"

[dev-dependencies]
serde_json.workspace = true
# Only `feature_async` uses tokio directly: timers, TCP, async IO, and file reads.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "io-util", "fs"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
